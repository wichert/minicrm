version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - noctx
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - errcheck

formatters:
  enable:
    - gofmt

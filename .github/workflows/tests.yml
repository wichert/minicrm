name: Tests

# Reusable workflow holding all lint/test/e2e jobs, called by both ci.yml and
# release.yml so CI and the release gate always run the identical test suite.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: minicrm_test_password
          POSTGRES_DB: minicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://minicrm:minicrm_test_password@localhost:5432/minicrm_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run unit & integration tests
        run: go test -v -race ./...

  frontend:
    name: Frontend (bundle + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      # The bundles are committed assets served from internal/web/static (and
      # embedded in the binary), so a stale build must fail CI rather than ship.
      - name: Build bundles
        run: npm run build
        working-directory: frontend

      - name: Check committed bundles are up to date
        run: git diff --exit-code -- internal/web/static/app.js internal/web/static/editor.js

  e2e:
    name: End-to-End Tests (MiniCRM + dev-oidc)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: minicrm_test_password
          POSTGRES_DB: minicrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      MINICRM_HTTP_ADDR: "127.0.0.1:8080"
      MINICRM_DATABASE_URL: "postgres://minicrm:minicrm_test_password@127.0.0.1:5432/minicrm_e2e?sslmode=disable"
      MINICRM_BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
      MINICRM_BOOTSTRAP_ADMIN_NAME: "Dev Admin"
      MINICRM_COOKIE_SECURE: "false"
      MINICRM_OIDC_GROUPS_CLAIM: "groups"
      MINICRM_ACCOUNT_1_ID: "support"
      MINICRM_ACCOUNT_1_NAME: "Support"
      MINICRM_ACCOUNT_1_OIDC_GROUP: "crm-support"
      MINICRM_ACCOUNT_1_IMAP_HOST: "127.0.0.1"
      MINICRM_ACCOUNT_1_IMAP_PORT: "1993"
      MINICRM_ACCOUNT_1_IMAP_USERNAME: "support@example.com"
      MINICRM_ACCOUNT_1_IMAP_PASSWORD: "secret"
      MINICRM_ACCOUNT_1_SMTP_HOST: "127.0.0.1"
      MINICRM_ACCOUNT_1_SMTP_PORT: "1587"
      MINICRM_ACCOUNT_1_SMTP_USERNAME: "support@example.com"
      MINICRM_ACCOUNT_1_SMTP_PASSWORD: "secret"
      MINICRM_ACCOUNT_1_SMTP_FROM_ADDRESS: "support@example.com"
      MINICRM_ACCOUNT_2_ID: "sales"
      MINICRM_ACCOUNT_2_NAME: "Sales"
      MINICRM_ACCOUNT_2_OIDC_GROUP: "crm-sales"
      MINICRM_ACCOUNT_2_IMAP_HOST: "127.0.0.1"
      MINICRM_ACCOUNT_2_IMAP_PORT: "1993"
      MINICRM_ACCOUNT_2_IMAP_USERNAME: "sales@example.com"
      MINICRM_ACCOUNT_2_IMAP_PASSWORD: "secret"
      MINICRM_ACCOUNT_2_SMTP_HOST: "127.0.0.1"
      MINICRM_ACCOUNT_2_SMTP_PORT: "1587"
      MINICRM_ACCOUNT_2_SMTP_USERNAME: "sales@example.com"
      MINICRM_ACCOUNT_2_SMTP_PASSWORD: "secret"
      MINICRM_ACCOUNT_2_SMTP_FROM_ADDRESS: "sales@example.com"
      MINICRM_OIDC_ISSUER_URL: "http://127.0.0.1:9000"
      MINICRM_OIDC_CLIENT_ID: "minicrm-e2e"
      MINICRM_OIDC_CLIENT_SECRET: "minicrm-e2e-secret"
      MINICRM_OIDC_REDIRECT_URL: "http://127.0.0.1:8080/auth/callback"
      MINICRM_E2E_BASE_URL: "http://127.0.0.1:8080"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build dev-oidc and minicrm binaries
        run: |
          go build -o bin/dev-oidc ./cmd/dev-oidc
          go build -o bin/minicrm ./cmd/minicrm

      - name: Start dev-oidc and minicrm services & run E2E tests
        run: |
          ./bin/dev-oidc \
            -addr 127.0.0.1:9000 \
            -issuer http://127.0.0.1:9000 \
            -client-id minicrm-e2e \
            -client-secret minicrm-e2e-secret \
            -email admin@example.com \
            -name "Dev Admin" \
            -groups "crm-support,crm-sales" &
          DEV_OIDC_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/.well-known/openid-configuration >/dev/null; then
              break
            fi
            sleep 0.2
          done

          ./bin/minicrm &
          MINICRM_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/static/app.css; then
              break
            fi
            sleep 0.2
          done

          go test -v -race ./e2e/...

          kill $MINICRM_PID $DEV_OIDC_PID || true

name: Release Please

# Maintains CHANGELOG.md and opens a release PR summarizing Conventional
# Commits since the last release. Merging the release PR creates the version
# tag (vX.Y.Z) and the GitHub release with categorized notes, which then
# triggers release.yml to test and publish the Docker image.

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          release-type: go

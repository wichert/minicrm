# Dovecot configuration for the MiniCRM local test stack.
#
# The two accounts in /etc/dovecot/users authenticate with the password "secret".
# Both unencrypted IMAP
# (143, STARTTLS) and implicit TLS (993) are offered; MiniCRM uses implicit TLS by
# default (MINICRM_ACCOUNT_<N>_IMAP_IMPLICIT_TLS=true).

protocols = imap
listen = *

base_dir = /run/dovecot
log_path = /dev/stdout
info_log_path = /dev/stdout

# TLS certificate and key are generated by the compose "certgen" service.
ssl = yes
ssl_cert = </certs/tls.crt
ssl_key = </certs/tls.key
ssl_min_protocol = TLSv1.2

# MiniCRM always upgrades to TLS, so plaintext auth on the STARTTLS listener is fine
# for this local-only development server.
disable_plaintext_auth = no
auth_mechanisms = plain login

first_valid_uid = 5000
last_valid_uid = 5000

mail_home = /srv/vmail/%u
mail_location = maildir:/srv/vmail/%u/Maildir

passdb {
    driver = passwd-file
    args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
    driver = static
    args = uid=5000 gid=5000 home=/srv/vmail/%u
}

namespace inbox {
    inbox = yes
    separator = /

    mailbox Sent {
        special_use = \Sent
    }
    mailbox Archive {
        special_use = \Archive
    }
    mailbox Junk {
        special_use = \Junk
    }
}

service imap-login {
    inet_listener imap {
        port = 143
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}

service auth {
    unix_listener auth-userdb {
        mode = 0600
        user = vmail
    }
}
